[package]
name = "dayweave-core"
description = "Deterministic, offline-first domain and scheduling engine for DayWeave"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "parsing", "serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }

[dev-dependencies]
serde_json = "1.0.145"

[lints]
workspace = true
