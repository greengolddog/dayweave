services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dayweave_restore
      POSTGRES_USER: dayweave_restore
      POSTGRES_PASSWORD: restore-drill-only
    tmpfs:
      - /var/lib/postgresql/data:size=512m,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayweave_restore -d dayweave_restore"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [restore-private]

networks:
  restore-private:
    internal: true
