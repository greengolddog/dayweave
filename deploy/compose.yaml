name: dayweave

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dayweave}
      POSTGRES_USER: ${POSTGRES_USER:-dayweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: ${DAYWEAVE_API_IMAGE:-ghcr.io/greengolddog/dayweave-api:latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAYWEAVE_BIND: 0.0.0.0:8787
      DAYWEAVE_ENVIRONMENT: ${DAYWEAVE_ENVIRONMENT:-production}
      DAYWEAVE_AUTH_MODE: ${DAYWEAVE_AUTH_MODE:-legacy_static}
      DAYWEAVE_DATABASE_URL: postgres://${POSTGRES_USER:-dayweave}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dayweave}
      DAYWEAVE_DATABASE_MIN_CONNECTIONS: ${DAYWEAVE_DATABASE_MIN_CONNECTIONS:-1}
      DAYWEAVE_DATABASE_MAX_CONNECTIONS: ${DAYWEAVE_DATABASE_MAX_CONNECTIONS:-10}
      DAYWEAVE_DATABASE_ACQUIRE_TIMEOUT_SECONDS: ${DAYWEAVE_DATABASE_ACQUIRE_TIMEOUT_SECONDS:-10}
      DAYWEAVE_DEFAULT_USER_ID: ${DAYWEAVE_DEFAULT_USER_ID:-00000000-0000-4000-8000-000000000001}
      DAYWEAVE_DEFAULT_WORKSPACE_ID: ${DAYWEAVE_DEFAULT_WORKSPACE_ID:-00000000-0000-4000-8000-000000000002}
      DAYWEAVE_OWNER_SUBJECT: ${DAYWEAVE_OWNER_SUBJECT:-personal-owner}
      DAYWEAVE_DEFAULT_TIMEZONE: ${DAYWEAVE_DEFAULT_TIMEZONE:-Europe/Madrid}
      DAYWEAVE_API_TOKEN: ${DAYWEAVE_API_TOKEN:-}
      DAYWEAVE_PUBLIC_BASE_URL: ${DAYWEAVE_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      DAYWEAVE_MCP_ALLOWED_ORIGINS: ${DAYWEAVE_MCP_ALLOWED_ORIGINS:-}
      DAYWEAVE_MCP_OAUTH_ENABLED: ${DAYWEAVE_MCP_OAUTH_ENABLED:-false}
      DAYWEAVE_ASSISTANT_ENABLED: ${DAYWEAVE_ASSISTANT_ENABLED:-false}
      # Keep Google gates off by default. The empty OAuth values are
      # pass-through slots for an untracked root-owned environment/secret
      # injection; this manifest contains no provider credential.
      DAYWEAVE_GOOGLE_OAUTH_ENABLED: ${DAYWEAVE_GOOGLE_OAUTH_ENABLED:-false}
      DAYWEAVE_GOOGLE_OUTBOUND_ENABLED: ${DAYWEAVE_GOOGLE_OUTBOUND_ENABLED:-false}
      DAYWEAVE_GOOGLE_SCHEDULE_OUTBOUND_ENABLED: ${DAYWEAVE_GOOGLE_SCHEDULE_OUTBOUND_ENABLED:-false}
      DAYWEAVE_GOOGLE_OUTBOUND_APPROVAL_TTL_MINUTES: ${DAYWEAVE_GOOGLE_OUTBOUND_APPROVAL_TTL_MINUTES:-10}
      DAYWEAVE_GOOGLE_CLIENT_ID: ${DAYWEAVE_GOOGLE_CLIENT_ID:-}
      DAYWEAVE_GOOGLE_CLIENT_SECRET: ${DAYWEAVE_GOOGLE_CLIENT_SECRET:-}
      DAYWEAVE_GOOGLE_REDIRECT_URI: ${DAYWEAVE_GOOGLE_REDIRECT_URI:-}
      DAYWEAVE_GOOGLE_CREDENTIAL_KEYS: ${DAYWEAVE_GOOGLE_CREDENTIAL_KEYS:-}
      DAYWEAVE_GOOGLE_ACTIVE_CREDENTIAL_KEY_VERSION: ${DAYWEAVE_GOOGLE_ACTIVE_CREDENTIAL_KEY_VERSION:-}
      DAYWEAVE_GOOGLE_IDENTITY_KEY_VERSION: ${DAYWEAVE_GOOGLE_IDENTITY_KEY_VERSION:-}
      RUST_LOG: ${RUST_LOG:-dayweave_api=info,tower_http=info}
    ports:
      - 127.0.0.1:8080:8787
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [private]
    healthcheck:
      test: ["CMD", "/usr/local/bin/dayweave-api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:

networks:
  private:
    driver: bridge
