services:
  api:
    environment:
      DAYWEAVE_ASSISTANT_ENABLED: "true"
      DAYWEAVE_OPENAI_API_KEY: ${DAYWEAVE_OPENAI_API_KEY:?required for Android assistant}
      DAYWEAVE_OPENAI_MODEL: ${DAYWEAVE_OPENAI_MODEL:-gpt-5.6-luna}
      DAYWEAVE_ASSISTANT_REQUESTS_PER_MINUTE: ${DAYWEAVE_ASSISTANT_REQUESTS_PER_MINUTE:-6}
      DAYWEAVE_ASSISTANT_MAX_CONCURRENT_REQUESTS: ${DAYWEAVE_ASSISTANT_MAX_CONCURRENT_REQUESTS:-2}
      DAYWEAVE_ASSISTANT_DAILY_TOKEN_BUDGET: ${DAYWEAVE_ASSISTANT_DAILY_TOKEN_BUDGET:-1000000}
    cpus: ${DAYWEAVE_ASSISTANT_API_CPUS:-1.0}
    mem_limit: ${DAYWEAVE_ASSISTANT_API_MEMORY:-768m}
    pids_limit: ${DAYWEAVE_ASSISTANT_API_PIDS:-256}
