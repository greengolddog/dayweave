services:
  api:
    environment:
      DAYWEAVE_AUTH_MODE: credential_only
      DAYWEAVE_API_TOKEN: ""
      DAYWEAVE_MCP_OAUTH_ENABLED: "true"
      DAYWEAVE_MCP_OAUTH_RESOURCE: ${DAYWEAVE_MCP_OAUTH_RESOURCE:?required for MCP OAuth}
      DAYWEAVE_MCP_OAUTH_ISSUER: ${DAYWEAVE_MCP_OAUTH_ISSUER:?required for MCP OAuth}
      DAYWEAVE_MCP_OAUTH_OWNER_SUBJECT: ${DAYWEAVE_MCP_OAUTH_OWNER_SUBJECT:?required for MCP OAuth}
      DAYWEAVE_MCP_OAUTH_CLIENT_IDS: ${DAYWEAVE_MCP_OAUTH_CLIENT_IDS:?required for MCP OAuth}
      DAYWEAVE_MCP_OAUTH_ALLOWED_ORIGINS: ${DAYWEAVE_MCP_OAUTH_ALLOWED_ORIGINS:?required for MCP OAuth}
