[package]
name = "dayweave-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Private sync, integration, and Suggestions Inbox API for DayWeave"

[lints]
workspace = true

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dayweave-compose = { path = "../../crates/dayweave-compose" }
dayweave-core = { path = "../../crates/dayweave-core" }
dayweave-google = { path = "../../crates/dayweave-google" }
getrandom = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
mime = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "serde"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[dev-dependencies]
aws-lc-rs = { version = "1.18", features = ["ring-io"] }
http-body-util = "0.1"
