[workspace]
resolver = "2"
members = [
    "crates/dayweave-android-ffi",
    "crates/dayweave-codex",
    "crates/dayweave-compose",
    "crates/dayweave-core",
    "crates/dayweave-google",
    "crates/dayweave-scheduler-helper",
    "server/dayweave-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-DayWeave-Proprietary"
authors = ["greengolddog"]
repository = "https://github.com/greengolddog/dayweave"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
