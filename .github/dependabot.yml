version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5

  - package-ecosystem: swift
    directory: /apps/macos
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
