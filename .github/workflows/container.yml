name: API container

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "server/**"
      - "deploy/api.Dockerfile"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: |
            ghcr.io/greengolddog/dayweave-api:latest
            ghcr.io/greengolddog/dayweave-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

