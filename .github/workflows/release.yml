name: Direct release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the runtime verified by the app bundle gate
        run: scripts/install-codex-runtime-ci.sh
      - run: scripts/build-macos-app.sh
      - run: ditto -c -k --sequesterRsrc --keepParent dist/macos/DayWeave.app dist/DayWeave-macOS.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DayWeave-macOS
          path: dist/DayWeave-macOS.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: apps/android/gradlew --project-dir apps/android assembleRelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DayWeave-Android-unsigned
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
