name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dayweave_test
          POSTGRES_USER: dayweave
          POSTGRES_PASSWORD: dayweave-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayweave -d dayweave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DAYWEAVE_TEST_DATABASE_URL: postgres://dayweave:dayweave-test-only@127.0.0.1:5432/dayweave_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift build --package-path apps/macos
      - run: swift test --package-path apps/macos
      - run: scripts/build-macos-app.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: apps/android/gradlew --project-dir apps/android test lint assembleDebug

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate checked-in plugin contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("integrations/dayweave")
          manifest = json.loads((root / ".codex-plugin/plugin.json").read_text())
          mcp = json.loads((root / ".mcp.json").read_text())
          assert manifest["name"] == "dayweave"
          assert (root / manifest["skills"]).is_dir()
          assert "dayweave" in mcp["mcpServers"]
          assert "[TODO" not in (root / "skills/dayweave-scheduling/SKILL.md").read_text()
          PY
