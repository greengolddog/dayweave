name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dayweave_test
          POSTGRES_USER: dayweave
          POSTGRES_PASSWORD: dayweave-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayweave -d dayweave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DAYWEAVE_TEST_DATABASE_URL: postgres://dayweave:dayweave-test-only@127.0.0.1:5432/dayweave_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the runtime verified by the app bundle gate
        run: scripts/install-codex-runtime-ci.sh
      - run: swift build --package-path apps/macos -Xswiftc -warnings-as-errors
      - run: scripts/test-macos.sh -Xswiftc -warnings-as-errors
      - run: scripts/build-macos-app.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: apps/android/gradlew --project-dir apps/android test lint assembleDebug

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate checked-in plugin contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("integrations/dayweave")
          manifest = json.loads((root / ".codex-plugin/plugin.json").read_text())
          mcp = json.loads((root / ".mcp.json").read_text())
          assert manifest["name"] == "dayweave"
          assert (root / manifest["skills"]).is_dir()
          assert "dayweave" in mcp["mcpServers"]
          assert "[TODO" not in (root / "skills/dayweave-scheduling/SKILL.md").read_text()
          PY
