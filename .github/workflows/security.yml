name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-advisories:
    name: Rust advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Cargo.lock
        run: cargo audit

  repository:
    name: Dependencies, configuration, and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify immutable workflow action references
        run: |
          invalid_references="$({
            find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
              | xargs -0 grep -n -H -E '^[[:space:]]*(-[[:space:]]*)?uses:' \
              | sed -E 's/[[:space:]]+#.*$//' \
              | grep -Ev '@[0-9a-f]{40}$'
          } || true)"
          test -z "$invalid_references" || {
            printf '%s\n%s\n' 'Mutable action references:' "$invalid_references" >&2
            exit 1
          }
      - name: Test the redacting repository credential scanner
        run: python3 -B scripts/test-repository-credential-scanner.py
      - name: Scan every reachable Git object and historical path
        run: python3 -B scripts/scan-repository-credentials.py history
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container:
    name: API container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/api.Dockerfile
          load: true
          push: false
          tags: dayweave-api:security-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: dayweave-api:security-scan
          scanners: vuln,secret
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
