    - type: "mcp"
      value: "dayweave"
      description: "DayWeave schedule reading, exact simulation, and proposal-only submission tools"
      transport: "streamable_http"
      url: "http://127.0.0.1:8787/mcp"
policy:
  allow_implicit_invocation: true
